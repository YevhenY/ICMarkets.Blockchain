services:
  gateway:
    image: icmarkets-blockchain-gateway:prod
    container_name: blockchain-gateway-prod
    build:
      context: .
      dockerfile: ICMarkets.Blockchain.Gateway/Dockerfile
      args:
        BUILD_CONFIGURATION: Release
    ports:
      - "9000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
    volumes:
      - ./data/prod/gateway/logs:/app/logs
    depends_on:
      - api-1
      - api-2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - blockchain-network

  api-1:
    image: icmarkets-blockchain:prod
    container_name: blockchain-api-1-prod
    build:
      context: .
      dockerfile: ICMarkets.Blockchain.API/Dockerfile
      args:
        BUILD_CONFIGURATION: Release
    expose:
      - "8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/blockchain.sqlite
    volumes:
      - ./data/prod/data:/app/data
      - ./data/prod/api-1/logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - blockchain-network

  api-2:
    image: icmarkets-blockchain:prod
    container_name: blockchain-api-2-prod
    build:
      context: .
      dockerfile: ICMarkets.Blockchain.API/Dockerfile
      args:
        BUILD_CONFIGURATION: Release
    expose:
      - "8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/blockchain.sqlite
    volumes:
      - ./data/prod/data:/app/data
      - ./data/prod/api-2/logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - blockchain-network

networks:
  blockchain-network:
    driver: bridge
