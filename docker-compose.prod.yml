services:
  blockchain-api:
    image: icmarkets-blockchain:prod
    container_name: blockchain-api-prod
    ports:
      - "9080:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/blockchain.sqlite
    volumes:
      - ./data/prod/data:/app/data
      - ./data/prod/logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
